; Builds the example against the library in this repository.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../..
    bblanchon/ArduinoJson@^7.4.3
; Arduino-ESP32 2.x compiles with C++11 by default; the toolkit needs C++17.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
